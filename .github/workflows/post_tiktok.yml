name: Post TikTok PASSit (MANUAL / parked)
# Di-park: TIDAK jalan otomatis. Wawan upload manual dulu.
# Aktifkan lagi nanti dengan menambah trigger push paths ['reels/latest/**'].
on:
  workflow_dispatch:
jobs:
  tiktok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - name: Direct Post TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}
        run: python tiktok_post.py
